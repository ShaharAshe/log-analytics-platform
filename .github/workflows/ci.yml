name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-processor:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Open Docker
        run: docker compose up -d

      - name: Run Tests - processor
        run: ./mvnw test
        working-directory: ./processor

  test-ingest:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Open Docker
        run: docker compose up -d kafka

      - name: Run Tests - ingest
        run: ./mvnw test
        working-directory: ./ingest
